[package]
name = "okf-ingest"
version = "0.12.3"
edition = "2021"
license = "Apache-2.0"
description = "Open Knowledge Format (OKF) ingestion - the fixture-locked core: parse, validate, links, exact PPR ranking, query seeding, diff, fetch"
repository = "https://github.com/travisjakel/okf-ingest"
homepage = "https://github.com/travisjakel/okf-ingest"
keywords = ["knowledge-base", "markdown", "wiki", "pagerank", "okf"]
categories = ["parser-implementations", "text-processing"]
readme = "README.md"
# Integration tests assert against ../../conformance (repo-only fixtures) —
# they cannot pass from the published tarball, so keep them out of it.
exclude = ["tests/"]

[dependencies]
flate2 = "1.1.9"
regex = "1.13.1"
serde_json = "1.0.151"
sha1 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
yaml-rust2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
flate2 = "1.1.9"
serde_json = "1.0.151"
tar = "0.4.46"
tempfile = "3.27.0"
